  - {name: ctl-32b-compete, model_profile: qwen3_32b_fp8, points: [3], communication: private,
     condition_texts: {all: private_chat, llm1: compete_strict_instruction, llm2: compete_strict_instruction},
     wave: {t0: 0, t1: 0}}
  # fx-ctl-joint (owner-approved 2026-10-25): the joint-profit control ctl-32b-joint under the formula payoff block (payoff_examples formula, as the
  # fx-* arms of PR #170: the exact profit rule as equations, no example prices). Everything else equals ctl-32b-joint (seat notes
  # maximise_joint_profit, point 3, private chat, 2 firms); thinking ON only, the declared 20 pairs = 20 games per model (gpt-oss via
  # make_grid --model-profile gpt_oss_20b). Controls: ctl-32b-joint t1 (primed, neutral table) and fx-chat-p1 t1 (formula, uninstructed; point 1).
  - {name: fx-ctl-joint,    model_profile: qwen3_32b_fp8, points: [3], communication: private, thinking: [1],
