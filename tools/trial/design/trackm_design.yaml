  - {name: smoke-32b-tacit, model_profile: qwen3_32b_fp8, points: [3], communication: tacit,   condition_texts: {all: neutral},
     wordings: [0, 1], seeds: [1], wave: {t0: 0, t1: 0}}
  - {name: smoke-32b-chat,  model_profile: qwen3_32b_fp8, points: [3], communication: private, condition_texts: {all: private_chat},
     wordings: [0, 1], seeds: [1], wave: {t0: 0, t1: 0}}
  - {name: ctl-14b-joint,   model_profile: qwen3_14b,     points: [3], communication: private,
     condition_texts: {all: private_chat, llm1: maximise_joint_profit, llm2: maximise_joint_profit},
     wordings: [0, 1, 2], seeds: [1], wave: {t0: 0, t1: 0}}
  - {name: ctl-14b-compete, model_profile: qwen3_14b,     points: [3], communication: private,
     condition_texts: {all: private_chat, llm1: compete_instruction, llm2: compete_instruction},
     wordings: [0, 1, 2], seeds: [1], wave: {t0: 0, t1: 0}}
  # The 32B controls are the A2 positive control of the submission: the declared 20 (wording, seed) pairs (the design-wide
  # seeds_by_wording; no own seeds list), both thinking modes, at the headline's middle point 3, private chat. The compete control
  # uses the STRICT instruction (compete_strict_instruction = Elicitation COMPETITIVE_STRICT, PR #119); ctl-14b-compete keeps the old one.
  - {name: ctl-32b-joint,   model_profile: qwen3_32b_fp8, points: [3], communication: private,
